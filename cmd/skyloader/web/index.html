<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#1b1b1b" />
  <title>SkyLoader</title>
  <link rel="icon" href="skyloader.ico" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="skyloader.ico" alt="" width="32" height="32" />
        </div>
        <div class="brand-copy">
          <h1>SkyLoader</h1>
          <span class="version" id="version">v0.0.0</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn ghost small" id="folderBtn" type="button">Plugins folder</button>
        <button class="btn small" id="updateBtn" type="button">Check updates</button>
      </div>
    </header>

    <div class="banner hidden" id="updateBanner" role="status">
      <svg class="banner-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 11v5.2M12 7.6v.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      <div class="banner-copy">
        <strong id="updateTitle">Update available</strong>
        <span id="updateText"></span>
      </div>
      <div class="banner-actions">
        <button class="btn primary small" id="updateAction" type="button">Open update</button>
        <button class="icon-btn" id="updateDismiss" type="button" aria-label="Dismiss update notice">&#x2715;</button>
      </div>
    </div>

    <main class="layout">
      <section class="card plugins-card">
        <div class="card-head">
          <div>
            <h2>Plugins</h2>
            <p id="pluginSummary" class="muted">No plugins installed.</p>
          </div>
          <button class="btn primary" id="addBtn" type="button">Add plugins</button>
        </div>
        <div class="plugin-list" id="pluginList"></div>
        <div class="empty hidden" id="emptyState">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26">
              <path d="M9 3.5a2 2 0 0 1 2 2V6h2.5A1.5 1.5 0 0 1 15 7.5V10h.5a2 2 0 1 1 0 4H15v2.5a1.5 1.5 0 0 1-1.5 1.5H11v-.5a2 2 0 1 0-4 0v.5H4.5A1.5 1.5 0 0 1 3 16.5V14h.5a2 2 0 1 0 0-4H3V7.5A1.5 1.5 0 0 1 4.5 6H7v-.5a2 2 0 0 1 2-2Z"
                    fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
            </svg>
          </div>
          <h3>No plugins yet</h3>
          <p>Drop a plugin <code>.dll</code>, a <code>.zip</code> bundle here.</p>
        </div>
      </section>

      <aside class="side">
        <section class="card launch-card">
          <div class="card-head">
            <div>
              <h2>Launch</h2>
              <p class="muted">Start Sky with your plugin set.</p>
            </div>
          </div>

          <div class="status-row">
            <span class="dot" id="statusDot"></span>
            <span id="gameStatus">Sky is not running</span>
          </div>

          <div class="field-block">
            <div class="field-head">
              <label class="field-label" for="gamePath">Sky executable</label>
            </div>
            <div class="path-row">
              <input id="gamePath" type="text" spellcheck="false" autocomplete="off" />
              <button class="btn" id="browseBtn" type="button">Browse</button>
            </div>
          </div>

          <div class="field-block">
            <div class="field-head">
              <label class="field-label" for="bootstrapPath">Bootstrap</label>
              <span id="bootstrapState" class="field-state">SkyBootstrap.dll</span>
            </div>
            <div class="path-row">
              <input id="bootstrapPath" type="text" spellcheck="false" autocomplete="off" />
              <button class="btn" id="browseBootstrapBtn" type="button">Change</button>
            </div>
          </div>

          <label class="switch-row">
            <input id="autoInject" type="checkbox" />
            <span class="switch-copy">
              <strong>Auto-inject</strong>
              <small>Load enabled plugins when Sky starts.</small>
            </span>
            <span class="switch" aria-hidden="true"></span>
          </label>

          <div class="launch-actions">
            <button class="btn launch" id="launchBtn" type="button">Launch Sky</button>
            <button class="btn hidden" id="injectBtn" type="button">Inject now</button>
          </div>
          <p class="status-text" id="statusText">Ready.</p>

          <div class="card-links">
            <button class="link" id="openAppFolder" type="button">Open data folder</button>
            <button class="link" id="openLogs" type="button">Open logs</button>
            <button class="link" id="openPluginsFolder" type="button">Managed plugins</button>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3 id="modalTitle">Confirm</h3>
      <p id="modalMessage"></p>
      <div class="modal-actions">
        <button class="btn ghost" id="modalCancel" type="button">Cancel</button>
        <button class="btn primary" id="modalConfirm" type="button">Continue</button>
      </div>
    </div>
  </div>

  <div class="drop-overlay hidden" id="dropOverlay">
    <div class="drop-card">
      <div class="drop-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M5 19h14"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <strong>Drop to install</strong>
      <span>DLL · ZIP bundle · bundle folder</span>
    </div>
  </div>

  <div class="ui-layer hidden" id="uiLayer">
    <header class="ui-head">
      <div class="ui-title">
        <span class="plugin-dot"></span>
        <div>
          <strong id="uiName">Plugin UI</strong>
          <small id="uiMeta"></small>
        </div>
      </div>
      <div class="ui-actions">
        <button class="btn ghost small" id="uiReload" type="button">Reload</button>
        <button class="btn ghost small" id="uiBrowser" type="button">Open in browser</button>
        <button class="btn small" id="uiClose" type="button">Close</button>
      </div>
    </header>
    <iframe id="pluginFrame" title="Plugin UI" sandbox="allow-scripts allow-forms allow-popups allow-downloads allow-same-origin"></iframe>
  </div>

  <script src="app.js"></script>
</body>
</html>
